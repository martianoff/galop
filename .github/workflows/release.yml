name: Release

# Push a bare semver tag (`0.1.0`, no `v` prefix) to publish binaries.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

env:
  GALA_VERSION: "0.94.0"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goflags: -p=2
            gala: gala-linux-amd64
            target: galop-linux-amd64
          - os: windows-latest
            goflags: -p=2
            gala: gala-windows-amd64.exe
            target: galop-windows-amd64.exe
          # galop is pure Go, so the arm64 and macOS binaries are cross-compiled
          # on Linux. Their tests run in CI, which runs gala test on macOS. A
          # native macOS build compiles one package at a time and hit the
          # 120-minute limit for 0.2.5; a cross build takes about 13 minutes.
          - os: ubuntu-latest
            goflags: -p=2
            gala: gala-linux-amd64
            target: galop-linux-arm64
            goos: linux
            goarch: arm64
            cross: true
          - os: ubuntu-latest
            goflags: -p=2
            gala: gala-linux-amd64
            target: galop-darwin-amd64
            goos: darwin
            goarch: amd64
            cross: true
          - os: ubuntu-latest
            goflags: -p=2
            gala: gala-linux-amd64
            target: galop-darwin-arm64
            goos: darwin
            goarch: arm64
            cross: true
    timeout-minutes: 120
    # Same memory limits as CI; see the comment in ci.yml.
    env:
      GOFLAGS: ${{ matrix.goflags }}
      GOGC: "25"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - name: Install GALA CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          curl -fsSL -o "$RUNNER_TEMP/bin/gala$exe" \
            "https://github.com/martianoff/gala/releases/download/${GALA_VERSION}/${{ matrix.gala }}"
          chmod +x "$RUNNER_TEMP/bin/gala$exe"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Stamp version
        run: sed -i.bak "s/^val version = \".*\"/val version = \"${GITHUB_REF_NAME}\"/" cmd/galop/main.gala

      - name: Test
        if: ${{ !matrix.cross }}
        run: gala test

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          gala build -o "${{ matrix.target }}" ./cmd/galop
          ls -la

      # A cross-compiled binary can't run here, so check its format instead.
      - name: Check the binary's platform
        if: ${{ matrix.cross }}
        run: |
          file "${{ matrix.target }}"
          case "${{ matrix.target }}" in
            *linux-arm64) file "${{ matrix.target }}" | grep -q "ELF 64-bit.*aarch64" ;;
            *darwin-amd64) file "${{ matrix.target }}" | grep -q "Mach-O 64-bit x86_64" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > checksums-sha256.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "galop $GITHUB_REF_NAME" --generate-notes
