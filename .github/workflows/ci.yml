name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# galop is built with a pinned GALA release. Bump GALA_VERSION together with
# `gala` in gala.mod and the `gala` bazel_dep in MODULE.bazel.
env:
  GALA_VERSION: "0.93.1"

# Compiling one galop package can take 4-6 GB, because Go instantiates every
# collection method per element type (martianoff/gala#872). Unbounded parallel
# compiles ran both the 16 GB Linux runner and the 7 GB macOS runner out of
# memory. GOGC=25 keeps one compile near 4 GB; -p caps how many run at once.
#
# Pull requests run the two fast lanes: Bazel (every test, the ANTLR
# differential, the grammar corpus check) and `gala test` on Linux. The full CLI
# lanes on macOS and Windows run on pushes to main and on demand, until #872
# makes cold compiles cheap enough for pull requests.
jobs:
  bazel:
    name: bazel test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build and test
        run: bazel test //... --jobs=2

      # BUILD files are generated; a stale one means someone added or removed a
      # .gala file without running gazelle.
      - name: BUILD files are up to date
        run: |
          bazel run //:gazelle
          git diff --exit-code -- '*.bazel'

  cli:
    name: gala test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","asset":"gala-linux-amd64","goflags":"-p=2","timeout":10}]' || '[{"os":"ubuntu-latest","asset":"gala-linux-amd64","goflags":"-p=2","timeout":10},{"os":"macos-latest","asset":"gala-darwin-arm64","goflags":"-p=1","timeout":45},{"os":"windows-latest","asset":"gala-windows-amd64.exe","goflags":"-p=2","timeout":30}]') }}
    defaults:
      run:
        shell: bash
    env:
      GOFLAGS: ${{ matrix.goflags }}
      GOGC: "25"
    steps:
      - uses: actions/checkout@v5

      # Caches Go's build cache, so unchanged packages (the GALA stdlib, and
      # galop packages a change doesn't touch) aren't recompiled.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: gala.mod

      - name: Install GALA CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          curl -fsSL -o "$RUNNER_TEMP/bin/gala$exe" \
            "https://github.com/martianoff/gala/releases/download/${GALA_VERSION}/${{ matrix.asset }}"
          chmod +x "$RUNNER_TEMP/bin/gala$exe"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: GALA version
        run: gala version

      - name: Unit tests
        run: gala test

      # Pull requests check the CLI build and the grammar corpus in Bazel; the
      # full lanes also build the binary with `gala build` and run the corpus
      # check through it.
      - name: Build CLI and check grammar corpus
        if: github.event_name != 'pull_request'
        run: |
          bin=galop
          if [ "$RUNNER_OS" = "Windows" ]; then bin=galop.exe; fi
          gala build -o "$bin" ./cmd/galop
          "./$bin" -check -roundtrip testdata/grammars/*.g4
