name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos:
        description: Also run gala test on macOS (adds about 2 hours)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Runs on main fill the caches every other run reads, so let each one finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# galop is built with a pinned GALA release. Bump GALA_VERSION together with
# `gala` in gala.mod and the `gala` bazel_dep in MODULE.bazel.
env:
  GALA_VERSION: "0.101.0"

# Compiling one galop package can take 4-6 GB, because Go instantiates every
# collection method per element type (martianoff/gala#872). Unbounded parallel
# compiles ran both the 16 GB Linux runner and the 7 GB macOS runner out of
# memory. GOGC=25 keeps one compile near 4 GB; -p caps how many run at once.
#
# Pull requests run the two fast lanes: Bazel (every test, the ANTLR
# differential, the grammar corpus check) and `gala test` on Linux. The full CLI
# lanes run on pushes to main and on demand (workflow_dispatch), until #872
# makes cold compiles cheap enough for pull requests. Windows runs in both.
# macOS compiles one package at a time and takes about 2 hours, so it runs
# after the merge, on pushes to main, and on demand only when the run's
# `macos` input is ticked.
#
# Pull requests can only read caches saved on main. Pushes to main
# run cold when the cache is stale and fill it for the
# pull requests after them. A fully cold run (for example right after a GALA
# version bump, which invalidates the Go build cache) takes about 2 hours on
# macOS (-p=1) and about 45 minutes on Windows (gala#872); with main's cache a
# cold macOS build (-p=1) takes about an hour,
# a cold Linux run about 30 minutes, and Windows needs about 8 minutes after
# its tests to save the Go cache. Pull
# requests get the same limits as main: a change to the generator recompiles
# everything, which a short limit would turn into a red timeout.
jobs:
  bazel:
    name: bazel test
    # actions: write lets the job delete main's older caches after saving.
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The runner's root disk has about 14 GB free, and Bazel's output base for
      # these builds outgrows it ("no space left on device"). Drop preinstalled
      # SDKs galop never uses (.NET, GHC, CodeQL, Swift) first. Not Android:
      # the runner sets ANDROID_HOME, and rules_android fails without the SDK.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - uses: actions/checkout@v5

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      # Bazel's disk cache. setup-bazel's own disk cache keeps the first copy of
      # a key forever, so it went stale; this one gets a fresh key per run,
      # restores the newest copy, and is saved even when the job fails or times
      # out. Only runs on main save it: other branches and pull requests can
      # read only main's caches, and their saves pushed main's out of the
      # repository's 10 GB cache quota. The save keeps only what this run used
      # (.github/scripts/cache.sh) and then deletes main's older copy, so one
      # copy of each cache stays and the quota holds them all.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ github.run_id }}
          restore-keys: bazel-disk-

      - name: Mark the restored cache unused
        run: .github/scripts/cache.sh mark ~/.cache/bazel-disk

      - name: Build and test
        timeout-minutes: 38
        run: |
          echo "common --disk_cache=$HOME/.cache/bazel-disk --experimental_disk_cache_gc_max_size=2G" >> ~/.bazelrc
          # Go compiles of the largest packages (analysis, golang, guess) peak at 7-9 GB
          # each (gala#872), and two at once exhaust the runner, which then kills
          # Bazel. rules_go doesn't pass --action_env or GOGC to its compiles,
          # so build those packages and their tests one action at a time first.
          bazel build //analysis:all //golang:all //guess:all --jobs=1
          bazel test //... --jobs=2

      # BUILD files are generated; a stale one means someone added or removed a
      # .gala file without running gazelle.
      - name: BUILD files are up to date
        run: |
          bazel run //:gazelle
          git diff --exit-code -- '*.bazel'

      - name: Drop cache entries this run did not use
        if: always()
        run: .github/scripts/cache.sh trim ~/.cache/bazel-disk

      - uses: actions/cache/save@v4
        id: save
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ github.run_id }}

      - name: Delete main's older Bazel caches
        if: always() && steps.save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/cache.sh prune bazel-disk- bazel-disk-${{ github.run_id }}

  # The performance gate (docs/FUZZ_AND_PERF.md): counters and wall-clock
  # ratios of galop's parsers for gala.g4, judged against
  # differential/perf/baseline.json. It reports in the job summary and keeps
  # its numbers as an artifact; with PERF_ENFORCE "true" a regression fails
  # the job. A cold cache must never turn a pull request red: the build and
  # the measurement run under a time budget, and running out of it skips the
  # gate with a notice instead of failing.
  perf:
    name: performance gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PERF_ENFORCE: "true"
      # Seconds for the build and the measurement, inside the job limit.
      PERF_BUDGET: 1500
    steps:
      # The runner's root disk has about 14 GB free, and Bazel's output base for
      # these builds outgrows it ("no space left on device"). Drop preinstalled
      # SDKs galop never uses (.NET, GHC, CodeQL, Swift) first. Not Android:
      # the runner sets ANDROID_HOME, and rules_android fails without the SDK.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - uses: actions/checkout@v5

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ github.run_id }}
          restore-keys: bazel-disk-

      - name: Performance gate
        run: |
          echo "common --disk_cache=$HOME/.cache/bazel-disk --experimental_disk_cache_gc_max_size=2G" >> ~/.bazelrc
          set +e
          # The largest packages compile one at a time, as in the bazel job.
          timeout "$PERF_BUDGET" bash -c '
            bazel build //analysis:all //golang:all --jobs=1 &&
            bazel run //differential/cmd/perfgate --jobs=2 -- -enforce=$PERF_ENFORCE -json="$RUNNER_TEMP/perf.json"'
          status=$?
          if [ "$status" -eq 124 ]; then
            echo "::notice::Performance gate skipped: the build and measurement ran past ${PERF_BUDGET}s (a cold cache)."
            exit 0
          fi
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf
          path: ${{ runner.temp }}/perf.json
          if-no-files-found: ignore

  # The large fuzz runs compare galop with ANTLR on tens of thousands of
  # mutated and generated files, too slow for pull requests. Each set runs on
  # its own runner, so the wall-clock time is the slowest set's and a runner
  # holds one test process (the generated sets peak near 7 GB, mostly
  # ANTLR's caches). They start from the Bazel disk cache an earlier run saved.
  fuzz:
    name: fuzz (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: corpus mutants
            targets: //differential/diff:mutations_large_test
          - name: held-out mutants
            targets: //differential/diff:heldout_mutations_large_test
          - name: corpus recovery
            targets: //differential/diff:recovery_large_test
          - name: held-out recovery
            targets: //differential/diff:heldout_recovery_large_test
          - name: generated 1
            targets: //differential/diff:generated_large_1_test
          - name: generated 2
            targets: //differential/diff:generated_large_2_test
          - name: generated 3
            targets: //differential/diff:generated_large_3_test
          - name: generated 4
            targets: //differential/diff:generated_large_4_test
    steps:
      # The runner's root disk has about 14 GB free, and Bazel's output base for
      # these builds outgrows it ("no space left on device"). Drop preinstalled
      # SDKs galop never uses (.NET, GHC, CodeQL, Swift) first. Not Android:
      # the runner sets ANDROID_HOME, and rules_android fails without the SDK.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - uses: actions/checkout@v5

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ github.run_id }}
          restore-keys: bazel-disk-

      - name: Fuzz
        run: |
          echo "common --disk_cache=$HOME/.cache/bazel-disk --experimental_disk_cache_gc_max_size=2G" >> ~/.bazelrc
          bazel build //analysis:all //golang:all --jobs=1
          bazel test ${{ matrix.targets }} --jobs=2

  # A wider performance report than the gate's (the whole corpus, more
  # mutants and runs), not judged against the baseline.
  perf-sweep:
    name: performance sweep
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The runner's root disk has about 14 GB free, and Bazel's output base for
      # these builds outgrows it ("no space left on device"). Drop preinstalled
      # SDKs galop never uses (.NET, GHC, CodeQL, Swift) first. Not Android:
      # the runner sets ANDROID_HOME, and rules_android fails without the SDK.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - uses: actions/checkout@v5

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ github.run_id }}
          restore-keys: bazel-disk-

      - name: Performance sweep (report only)
        run: |
          echo "common --disk_cache=$HOME/.cache/bazel-disk --experimental_disk_cache_gc_max_size=2G" >> ~/.bazelrc
          bazel build //analysis:all //golang:all --jobs=1
          bazel run //differential/cmd/perfgate --jobs=2 -- -baseline= -every=1 -mutants=300 -runs=7 -passes=7

  cli:
    name: gala test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # actions: write lets the job delete main's older caches after saving.
    permissions:
      contents: read
      actions: write
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests: Linux. Pushes to main: Linux, macOS, Windows. On demand:
        # Linux and Windows, plus macOS when the `macos` input is ticked.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","asset":"gala-linux-amd64","goflags":"-p=2","timeout":45,"tests":30}]' || (github.event_name == 'push' || inputs.macos) && '[{"os":"ubuntu-latest","asset":"gala-linux-amd64","goflags":"-p=2","timeout":45,"tests":30},{"os":"macos-latest","asset":"gala-darwin-arm64","goflags":"-p=1","timeout":150,"tests":130},{"os":"windows-latest","asset":"gala-windows-amd64.exe","goflags":"-p=2","timeout":75,"tests":50}]' || '[{"os":"ubuntu-latest","asset":"gala-linux-amd64","goflags":"-p=2","timeout":45,"tests":30},{"os":"windows-latest","asset":"gala-windows-amd64.exe","goflags":"-p=2","timeout":75,"tests":50}]') }}
    defaults:
      run:
        shell: bash
    # -trimpath lets `gala build` reuse what `gala test` compiled. The two
    # commands generate the same Go into different workspace directories, and
    # without -trimpath Go's build cache keys every package by its directory,
    # so the build compiled everything again (38 minutes on macOS).
    env:
      GOFLAGS: ${{ matrix.goflags }} -trimpath
      GOGC: "25"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      # The Windows runner's C: drive has little free space; D: has plenty.
      # Keep Go's build cache and temp files (and the GALA build workspace,
      # which lives under TEMP) on D:.
      - name: Put build files on the larger drive (Windows)
        if: runner.os == 'Windows'
        run: |
          d="$RUNNER_TEMP/gobuild"
          mkdir -p "$d/cache" "$d/tmp"
          {
            echo "GOCACHE=$d/cache"
            echo "GOTMPDIR=$d/tmp"
            echo "TMP=$d/tmp"
            echo "TEMP=$d/tmp"
          } >> "$GITHUB_ENV"

      # Go's build cache, so unchanged packages (the GALA stdlib, and galop
      # packages a change doesn't touch) aren't recompiled. Saved even when the
      # job fails or times out, so one cold run warms the next.
      - name: Locate Go build cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: gobuild-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: gobuild-${{ matrix.os }}-

      - name: Mark the restored cache unused
        run: .github/scripts/cache.sh mark "${{ steps.gocache.outputs.dir }}"

      - name: Install GALA CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          curl -fsSL -o "$RUNNER_TEMP/bin/gala$exe" \
            "https://github.com/martianoff/gala/releases/download/${GALA_VERSION}/${{ matrix.asset }}"
          chmod +x "$RUNNER_TEMP/bin/gala$exe"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: GALA version
        run: gala version

      - name: Unit tests
        # Leaves room under the job limit for the cache save below.
        timeout-minutes: ${{ matrix.tests }}
        run: gala test

      # Pull requests check the CLI build and the grammar corpus in Bazel; the
      # full lanes also build the binary with `gala build` and run the corpus
      # check through it.
      - name: Build CLI and check grammar corpus
        if: github.event_name != 'pull_request'
        run: |
          bin=galop
          if [ "$RUNNER_OS" = "Windows" ]; then bin=galop.exe; fi
          gala build -o "$bin" ./cmd/galop
          "./$bin" -check -roundtrip testdata/grammars/*.g4

      - name: Drop cache entries this run did not use
        if: always()
        run: .github/scripts/cache.sh trim "${{ steps.gocache.outputs.dir }}"

      - uses: actions/cache/save@v4
        id: save
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: gobuild-${{ matrix.os }}-${{ github.run_id }}

      - name: Delete main's older Go caches
        if: always() && steps.save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/cache.sh prune gobuild-${{ matrix.os }}- gobuild-${{ matrix.os }}-${{ github.run_id }}
