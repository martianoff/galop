name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# galop is built with a pinned GALA release. Bump GALA_VERSION together with
# `gala` in gala.mod and the `gala` bazel_dep in MODULE.bazel.
env:
  GALA_VERSION: "0.93.1"

jobs:
  cli:
    name: gala test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hard ceiling: a lane that runs longer than this is a bug, not a slow day.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: gala-linux-amd64
          - os: macos-latest
            asset: gala-darwin-arm64
            # Compiling one galop package can take 4-6 GB (Go instantiates every
            # collection method per element type). The 7 GB macOS runner swapped
            # for hours with three compiles at once; one at a time with a tighter
            # GC fits.
            goflags: -p=1
            gogc: "25"
          - os: windows-latest
            asset: gala-windows-amd64.exe
    defaults:
      run:
        shell: bash
    env:
      GOFLAGS: ${{ matrix.goflags }}
      GOGC: ${{ matrix.gogc }}
    steps:
      - uses: actions/checkout@v5

      # Caches Go's build cache, so unchanged packages (the GALA stdlib, and
      # galop packages a change doesn't touch) aren't recompiled.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: gala.mod

      - name: Install GALA CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          curl -fsSL -o "$RUNNER_TEMP/bin/gala$exe" \
            "https://github.com/martianoff/gala/releases/download/${GALA_VERSION}/${{ matrix.asset }}"
          chmod +x "$RUNNER_TEMP/bin/gala$exe"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: GALA version
        run: gala version

      - name: Unit tests
        run: gala test

      - name: Build CLI
        run: |
          bin=galop
          if [ "$RUNNER_OS" = "Windows" ]; then bin=galop.exe; fi
          gala build -o "$bin" ./cmd/galop
          echo "GALOP=./$bin" >> "$GITHUB_ENV"

      # The corpus check: every grammar under testdata/grammars parses, passes
      # the semantic checks, and round-trips through the formatter.
      - name: Check grammar corpus
        run: '"$GALOP" -check -roundtrip testdata/grammars/*.g4'

  bazel:
    name: bazel test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build and test
        # The generated parsers make a few Go compiles very large; running four of
        # them at once ran the 16 GB runner out of memory.
        run: bazel test //... --jobs=2

      # BUILD files are generated; a stale one means someone added or removed a
      # .gala file without running gazelle.
      - name: BUILD files are up to date
        run: |
          bazel run //:gazelle
          git diff --exit-code -- '*.bazel'
