name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Runs on main fill the caches every other run reads, so let each one finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# galop is built with a pinned GALA release. Bump GALA_VERSION together with
# `gala` in gala.mod and the `gala` bazel_dep in MODULE.bazel.
env:
  GALA_VERSION: "0.93.1"

# Compiling one galop package can take 4-6 GB, because Go instantiates every
# collection method per element type (martianoff/gala#872). Unbounded parallel
# compiles ran both the 16 GB Linux runner and the 7 GB macOS runner out of
# memory. GOGC=25 keeps one compile near 4 GB; -p caps how many run at once.
#
# Pull requests run the two fast lanes: Bazel (every test, the ANTLR
# differential, the grammar corpus check) and `gala test` on Linux. The full CLI
# lanes on macOS and Windows run on pushes to main and on demand, until #872
# makes cold compiles cheap enough for pull requests.
#
# Pull requests can only read caches saved on main, so pushes to main get
# longer limits: they run cold when the cache is stale and fill it for the
# pull requests after them: a cold macOS build (-p=1) takes about an hour,
# a cold Linux run about 30 minutes, and Windows needs about 8 minutes after
# its tests to save the Go cache. Pull
# requests stay within 10 minutes.
jobs:
  bazel:
    name: bazel test
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 45 }}
    steps:
      - uses: actions/checkout@v5

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      # Bazel's disk cache. setup-bazel's own disk cache keeps the first copy of
      # a key forever, so it went stale; this one gets a fresh key per run,
      # restores the newest copy, and is saved even when the job fails or times
      # out. Bazel trims it to 2 GB. Only runs on main save it: other branches
      # and pull requests can read only main's caches, and their saves pushed
      # main's out of the repository's 10 GB cache quota.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ github.run_id }}
          restore-keys: bazel-disk-

      - name: Build and test
        timeout-minutes: ${{ github.event_name == 'pull_request' && 8 || 38 }}
        run: |
          echo "common --disk_cache=$HOME/.cache/bazel-disk --experimental_disk_cache_gc_max_size=2G" >> ~/.bazelrc
          # Go compiles of the largest packages (analysis, golang, guess) peak at 7-9 GB
          # each (gala#872), and two at once exhaust the runner, which then kills
          # Bazel. rules_go doesn't pass --action_env or GOGC to its compiles,
          # so build those packages and their tests one action at a time first.
          bazel build //analysis:all //golang:all //guess:all --jobs=1
          bazel test //... --jobs=2

      # BUILD files are generated; a stale one means someone added or removed a
      # .gala file without running gazelle.
      - name: BUILD files are up to date
        run: |
          bazel run //:gazelle
          git diff --exit-code -- '*.bazel'

      - uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ github.run_id }}

  # The large mutation runs compare galop with ANTLR on tens of thousands of
  # mutated files, too slow for pull requests. They start from the Bazel disk
  # cache an earlier run saved.
  fuzz:
    name: mutation fuzz
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ github.run_id }}
          restore-keys: bazel-disk-

      - name: Mutation fuzz
        run: |
          echo "common --disk_cache=$HOME/.cache/bazel-disk --experimental_disk_cache_gc_max_size=2G" >> ~/.bazelrc
          bazel test //differential/diff:mutations_large_test //differential/diff:heldout_mutations_large_test --jobs=2

  cli:
    name: gala test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","asset":"gala-linux-amd64","goflags":"-p=2","timeout":10,"tests":8}]' || '[{"os":"ubuntu-latest","asset":"gala-linux-amd64","goflags":"-p=2","timeout":45,"tests":30},{"os":"macos-latest","asset":"gala-darwin-arm64","goflags":"-p=1","timeout":90,"tests":75},{"os":"windows-latest","asset":"gala-windows-amd64.exe","goflags":"-p=2","timeout":45,"tests":25}]') }}
    defaults:
      run:
        shell: bash
    env:
      GOFLAGS: ${{ matrix.goflags }}
      GOGC: "25"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      # The Windows runner's C: drive has little free space; D: has plenty.
      # Keep Go's build cache and temp files (and the GALA build workspace,
      # which lives under TEMP) on D:.
      - name: Put build files on the larger drive (Windows)
        if: runner.os == 'Windows'
        run: |
          d="$RUNNER_TEMP/gobuild"
          mkdir -p "$d/cache" "$d/tmp"
          {
            echo "GOCACHE=$d/cache"
            echo "GOTMPDIR=$d/tmp"
            echo "TMP=$d/tmp"
            echo "TEMP=$d/tmp"
          } >> "$GITHUB_ENV"

      # Go's build cache, so unchanged packages (the GALA stdlib, and galop
      # packages a change doesn't touch) aren't recompiled. Saved even when the
      # job fails or times out, so one cold run warms the next.
      - name: Locate Go build cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: gobuild-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: gobuild-${{ matrix.os }}-

      - name: Install GALA CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          curl -fsSL -o "$RUNNER_TEMP/bin/gala$exe" \
            "https://github.com/martianoff/gala/releases/download/${GALA_VERSION}/${{ matrix.asset }}"
          chmod +x "$RUNNER_TEMP/bin/gala$exe"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: GALA version
        run: gala version

      - name: Unit tests
        # Leaves room under the job limit for the cache save below.
        timeout-minutes: ${{ matrix.tests }}
        run: gala test

      # Pull requests check the CLI build and the grammar corpus in Bazel; the
      # full lanes also build the binary with `gala build` and run the corpus
      # check through it.
      - name: Build CLI and check grammar corpus
        if: github.event_name != 'pull_request'
        run: |
          bin=galop
          if [ "$RUNNER_OS" = "Windows" ]; then bin=galop.exe; fi
          gala build -o "$bin" ./cmd/galop
          "./$bin" -check -roundtrip testdata/grammars/*.g4

      - uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: gobuild-${{ matrix.os }}-${{ github.run_id }}
